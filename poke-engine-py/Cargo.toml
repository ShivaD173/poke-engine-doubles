[package]
name = "poke_engine"
edition = "2021"
version = "0.0.7"

[lib]
name = "poke_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
pyo3 = { version = "0.22.5", features = ["extension-module"] }
poke-engine = { path = "../" }

[features]
system_allocator = ["poke-engine/system_allocator"]
default = ["poke-engine/terastallization"]
